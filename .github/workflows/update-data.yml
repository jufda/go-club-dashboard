name: Update Go Club Data

on:
  schedule:
    - cron: '11 1 * * 1,4'  # Runs at 01:11 UTC on Mondays and Thursdays
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Download and check latest season data
        id: season_check
        run: |
          python - <<'EOF'
          import io
          import os
          import requests
          import shutil
          from datetime import datetime
          from openpyxl import load_workbook

          LOCAL = "data/latest-season.xlsx"
          URL   = "https://docs.google.com/spreadsheets/d/1IjXQJSGUma8Deer0gT5uDDi0-VaDP3YFemMzHV1HLmA/export?format=xlsx"

          # Current season number is one above the highest archived goseason file
          existing = [f for f in os.listdir("data") if f.startswith("goseason") and f.endswith(".xlsx")]
          current_season = max(
              (int(f.replace("goseason", "").replace(".xlsx", "")) for f in existing),
              default=4
          ) + 1

          os.makedirs("data", exist_ok=True)

          print(f"Downloading latest season data (current season: {current_season})...")
          r = requests.get(URL, timeout=60)
          r.raise_for_status()
          # Keep bytes in memory — openpyxl does not support .tmp file extensions
          xlsx_bytes = r.content

          # ── Read season-end date and days remaining from "Hall of heroes" tab ──
          # Tab 4 "Hall of heroes":
          #   Row 3, col 11 ("Kautta jäljellä" label)  →  verified as sanity check
          #   Row 4, col 11  →  days remaining (number)
          #   Row 3, col 13  →  "Kausi loppuu" label    →  verified as sanity check
          #   Row 4, col 13  →  season-end date (Finnish format d.m.y)
          wb = load_workbook(io.BytesIO(xlsx_bytes), read_only=True, data_only=True)
          sheet_names = wb.sheetnames
          print(f"Sheets found: {sheet_names}")

          HOH_INDEX = 3  # 0-based index of the 4th tab
          hoh = wb.worksheets[HOH_INDEX]
          print(f"Reading from sheet: '{hoh.title}'")

          label_days   = hoh.cell(row=3, column=11).value
          days_left    = hoh.cell(row=4, column=11).value
          label_end    = hoh.cell(row=3, column=13).value
          season_end   = hoh.cell(row=4, column=13).value
          wb.close()

          print(f"  [{label_days!r}] days remaining: {days_left!r}")
          print(f"  [{label_end!r}] season end date: {season_end!r}")

          # Sanity-check that we are reading the right cells
          if label_days is None or "jäljellä" not in str(label_days):
              raise ValueError(
                  f"Expected 'Kautta jäljellä' in Hall of heroes row 3 col 11, "
                  f"got {label_days!r}. Check sheet layout."
              )
          if label_end is None or "loppuu" not in str(label_end):
              raise ValueError(
                  f"Expected 'Kausi loppuu' in Hall of heroes row 3 col 13, "
                  f"got {label_end!r}. Check sheet layout."
              )

          # Parse days remaining
          # The cell may hold a plain int or a Finnish string like '124 päivää'.
          import re as _re
          try:
              days_str = str(days_left).strip() if days_left is not None else ""
              m = _re.match(r"(\d+)", days_str)
              if m is None:
                  raise ValueError("no leading digits")
              days_remaining = int(m.group(1))
          except (TypeError, ValueError):
              raise ValueError(f"Could not parse days remaining as integer: {days_left!r}")

          # Parse season-end date (Finnish d.m.y, e.g. "31.5.2025")
          if isinstance(season_end, datetime):
              end_date = season_end.date()
          else:
              end_date = datetime.strptime(str(season_end).strip(), "%d.%m.%Y").date()

          today = datetime.utcnow().date()
          rolled_over = end_date < today

          print(f"Season ends: {end_date}  |  Today (UTC): {today}  |  Days left: {days_remaining}")
          print(f"Season rolled over: {rolled_over}")

          # ── Write files from in-memory bytes ─────────────────────────────
          if rolled_over:
              archive = f"data/goseason{current_season}.xlsx"
              if os.path.exists(LOCAL):
                  print(f"Archiving current season as {archive}")
                  os.replace(LOCAL, archive)
              else:
                  print(f"No existing file to archive; writing download as {archive}")
                  with open(archive, "wb") as fh:
                      fh.write(xlsx_bytes)
                  shutil.copy(archive, LOCAL)
          else:
              with open(LOCAL, "wb") as fh:
                  fh.write(xlsx_bytes)

          # ── Expose step outputs for the commit step ───────────────────────
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"rolled_over={str(rolled_over).lower()}\n")
              fh.write(f"current_season={current_season}\n")
              fh.write(f"days_remaining={days_remaining}\n")

          print("Done.")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if [ "${{ steps.season_check.outputs.rolled_over }}" = "true" ]; then
            MSG="Archive season ${{ steps.season_check.outputs.current_season }} and start new season (automated)"
          else
            MSG="Games updated, ${{ steps.season_check.outputs.days_remaining }} days left in the season (automated)"
          fi
          git diff --cached --quiet || git commit -m "$MSG"
          git push
