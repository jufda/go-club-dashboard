name: Update Go Club Data

on:
  schedule:
    - cron: '11 1 * * 1,4'  # Runs at 01:11 UTC on Mondays and Thursdays
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    # permissions:
      # contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '>=3.14'

      - name: Download latest data file
        run: |
          mkdir -p data
          curl -L "https://docs.google.com/spreadsheets/d/1IjXQJSGUma8Deer0gT5uDDi0-VaDP3YFemMzHV1HLmA/export?format=xlsx" -o data/latest-season.xlsx

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest-season.xlsx
          git diff --cached --quiet || git commit -m "Update latest-season.xlsx (automated)"
          git push
